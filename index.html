<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>cuồng phim</title>
</head>
<body><xt:code><div class="movie-home">
    <h2 class="movie-home-title">🎬 Danh sách phim</h2>
    <div class="movie-grid" id="movie-grid"></div>
</div>

<script type="text/javascript" src="/phim.js"></script>

<script type="text/javascript">
//<![CDATA[
(function () {
    var grid = document.getElementById('movie-grid');
    if (!grid || typeof MOVIES === 'undefined') return;

    var lines = MOVIES.split('\n');
    for (var i = 0; i < lines.length; i++) {
        if (!lines[i]) continue;
        var p = lines[i].split('|');
        var id    = p[0];
        var name  = p[1];
        var cover = p[2];
        var badge = p[3] || '';

        var a = document.createElement('a');
        a.className = 'movie-card';
        a.href = '/watch?id=' + id;
        a.innerHTML =
            '<div class="movie-cover">' +
                '<img src="' + cover + '" alt="' + name + '" loading="lazy">' +
                (badge ? '<span class="movie-badge">' + badge + '</span>' : '') +
            '</div>' +
            '<span class="movie-name">' + name + '</span>';

        grid.appendChild(a);
    }
})();
//]]>
</script></xt:code>
    <div data-xtcontainer="container" class="xt_container">
    </div>
</body>
</html>
